name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -yq libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # The CLI and API references are generated; fail if the committed copies are stale.
      - run: cargo xtask docs --check
      # Every file needs an SPDX header or a REUSE.toml annotation.
      - run: cargo xtask reuse-check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the book (strict, so broken links and images fail)
        run: |
          pip install -r docs/requirements.txt
          zensical build --strict --clean

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, gpu: software }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, gpu: software }
          - { os: macos-15, target: aarch64-apple-darwin, gpu: none }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: lavapipe (Linux software Vulkan)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq mesa-vulkan-drivers libvulkan1 libxkbcommon-dev libwayland-dev
      # The video tests make small MP4, MKV and AVI files with ffmpeg. Linux must have it; elsewhere a
      # missing ffmpeg skips them.
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -yq ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      # Windows uses WARP (DX12 software adapter), which ships with the OS.
      - run: cargo test --workspace --all-features --target ${{ matrix.target }}
        env:
          HELIA_GPU_TESTS: ${{ matrix.gpu }}
          HELIA_REQUIRE_FFMPEG: ${{ runner.os == 'Linux' && '1' || '' }}
      - run: cargo build --release --workspace --target ${{ matrix.target }}

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version
        id: msrv
        run: echo "v=$(sed -n 's/^rust-version = \"\(.*\)\"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - run: sudo apt-get update -q && sudo apt-get install -yq libxkbcommon-dev libwayland-dev
      - run: cargo check --workspace --all-targets --all-features

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update -q && sudo apt-get install -yq mesa-vulkan-drivers libvulkan1 libxkbcommon-dev libwayland-dev ffmpeg
      # Ratchet: raise the floor as coverage grows, never lower it.
      - run: cargo llvm-cov --workspace --exclude helia-gui --all-features --lcov --output-path lcov.info --fail-under-lines 80
        env:
          HELIA_GPU_TESTS: software
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
