# cargo-about configuration for the THIRD-PARTY-LICENSES file in release archives.
# The accepted list mirrors deny.toml: GPL-3.0-or-later compatible licences only.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
