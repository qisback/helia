# cargo-about configuration for the THIRD-PARTY-LICENSES file in release archives.
# The accepted list mirrors deny.toml: permissive licences only. The workspace crates
# are GPL-3.0-or-later and are accepted by name.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true

[helia-cli]
accepted = ["GPL-3.0-or-later"]

[helia-core]
accepted = ["GPL-3.0-or-later"]

[helia-feedback]
accepted = ["GPL-3.0-or-later"]

[helia-gpu]
accepted = ["GPL-3.0-or-later"]

[helia-gui]
accepted = ["GPL-3.0-or-later"]

[helia-report]
accepted = ["GPL-3.0-or-later"]

[helia-server]
accepted = ["GPL-3.0-or-later"]

[xtask]
accepted = ["GPL-3.0-or-later"]
