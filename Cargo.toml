[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/qisback/helia"
homepage = "https://qisback.github.io/helia/"
documentation = "https://qisback.github.io/helia/"
keywords = ["astronomy", "astrophotography", "image-processing", "gpu", "solar"]
categories = ["science", "multimedia::images"]
authors = ["Laurence Horrocks-Barlow"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# Tests crunch images; keep them fast in debug.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2
