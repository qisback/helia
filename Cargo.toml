[workspace]
resolver = "3"
members = ["crates/*", "xtask", "examples/plugins/invert"]
exclude = ["fuzz"]

[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/qisback/helia"
homepage = "https://qisback.github.io/helia/"
documentation = "https://qisback.github.io/helia/"
keywords = ["astronomy", "astrophotography", "image-processing", "gpu", "solar"]
categories = ["science", "multimedia::images"]
authors = ["Laurence Horrocks-Barlow"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
# `store` is a cargo feature that exists only in the official store build: its tooling adds the
# feature and the optional dependency to the manifests it builds. It is not declared here, so
# `--all-features` never turns it on; this only tells rustc the name is intended.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("store"))'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# Tests crunch images; keep them fast in debug.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2
