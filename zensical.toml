[project.theme]
language = "en"
logo = "images/favicon-header.png"
custom_dir = "docs/overrides"
favicon = "images/favicon.png"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/qisback/helia"
name = "Helia on GitHub"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true

# Old page paths that moved: /introduction/ was the home page before it became index.md.
[project.plugins.redirects.redirect_maps]
"introduction.md" = "index.md"
