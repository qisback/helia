# Zensical (zensical.org) builds the documentation site from docs/book/src.
# Build: `zensical build --clean` (version pinned in docs/requirements.txt).
# The navigation below replaces the old mdBook SUMMARY.md. Every page under
# docs/book/src must be in `nav` or in `exclude_docs`: `cargo xtask coverage` checks it.
[project]
site_name = "Helia"
site_description = "Helia is a fast, free, GPU-accelerated solar lucky-imaging stacker and sharpener for Windows, macOS and Linux: rank frames, align, stack, sharpen and colour H-alpha, calcium K and white-light captures."
site_author = "Laurence Horrocks-Barlow"
site_url = "https://qisback.github.io/helia/"
docs_dir = "docs/book/src"
site_dir = "site"
use_directory_urls = true
repo_url = "https://github.com/qisback/helia"
repo_name = "qisback/helia"
copyright = "Copyright (C) 2026 Laurence Horrocks-Barlow. Helia is free software under the GPL-3.0-or-later licence, with the additional terms in ADDITIONAL-TERMS.md. Made by <a href=\"https://12hobbies.studio/\">12hobbies.studio</a>."
extra_css = ["stylesheets/extra.css"]
exclude_docs = """
reference/openapi.json
"""

