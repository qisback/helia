# Helia is GPL-3.0-or-later with additional terms under GPLv3 section 7 (7(b) and 7(c)): see
# ADDITIONAL-TERMS.md. The terms are not an SPDX licence; the files point to them in their headers.
# REUSE specification 3.2 annotations for files that cannot carry a header.
# Source files (Rust, WGSL, Python, shell, workflow YAML) carry their own
# SPDX headers; `cargo xtask reuse-check` enforces both.
version = 1

[[annotations]]
path = [
  "LICENSE",
  "REUSE.toml",
  "Cargo.lock",
  "**/Cargo.toml",
  "**/Cargo.lock",
  "deny.toml",
  ".security-audit/*.json",
  ".security-audit/*.toml",
  "rustfmt.toml",
  "clippy.toml",
  "zensical.toml",
  ".cargo/**",
  ".gitattributes",
  ".gitignore",
  "*.md",
  ".forgejo/*.md",
  ".github/*.md",
  ".github/FUNDING.yml",
  "docs/**",
  "packaging/testdata/**",
  "packaging/SUBMITTING.md",
  "tools/bench/results/*.json",
  "packaging/about.hbs",
  "packaging/about.toml",
  "packaging/external/helia-items.json",
  "packaging/external/licences/package-manager.txt",
  "packaging/linux/helia.desktop",
  "packaging/linux/copyright",
  "packaging/linux/*.xml",
  "packaging/linux/*.xml.in",
  "packaging/linux/*.spec.in",
  "packaging/linux/Dockerfile.*",
  "packaging/macos/Info.plist.in",
  "packaging/windows/helia.nsi",
  "crates/helia-server/src/docs.html",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Laurence Horrocks-Barlow"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Third-party: IBM Plex fonts keep their own copyright and licence.
[[annotations]]
path = ["crates/helia-gui/assets/fonts/IBMPlex*.ttf", "crates/helia-gui/assets/fonts/OFL-IBM-Plex.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"

# The plugin SDK and the example plugins are MIT OR Apache-2.0, not GPL, so that a plugin built on
# them may have any licence (the owner holds all the copyright). The SDK depends on no Helia crate.
[[annotations]]
path = [
  "crates/helia-plugin-sdk/**",
  "examples/plugins/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Laurence Horrocks-Barlow"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The AppImage runtime notice is Helia text; the LGPL text is the Free Software Foundation's, kept
# verbatim and shipped inside the AppImage because the runtime links libfuse (issue 212).
[[annotations]]
path = ["packaging/linux/appimage-runtime-notice.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Laurence Horrocks-Barlow"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Licence texts shown to the user before an external tool is installed: the Free Software
# Foundation's text, kept verbatim (packaging/external/build_manifest.py inlines them).
[[annotations]]
path = ["packaging/external/licences/LGPL-3.0-or-later.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = ["packaging/external/licences/GPL-3.0-or-later.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["packaging/linux/licences/LGPL-2.1.txt"]
precedence = "override"
SPDX-FileCopyrightText = "1991, 1999 Free Software Foundation, Inc."
SPDX-License-Identifier = "LGPL-2.1-only"

# The Helia logo and every image derived from it: all rights reserved, not GPL.
# See LOGO-LICENCE.md. Override the aggregate annotation above for the copies under docs/.
[[annotations]]
path = [
  "assets/branding/**",
  "docs/book/src/images/helia-logo.png",
  "docs/book/src/images/favicon-header.png",
  "docs/book/src/images/favicon.png",
  "docs/book/src/images/social.png",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Laurence Horrocks-Barlow"
SPDX-License-Identifier = "LicenseRef-Helia-Logo"

# Real screenshots and pictures for the manual, made by running Helia on the owner's own captures
# (docs/book/src/walkthrough/index.md says how). Owner copyright, same licence as the book.
[[annotations]]
path = ["docs/book/src/images/real/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Laurence Horrocks-Barlow"
SPDX-License-Identifier = "GPL-3.0-or-later"
