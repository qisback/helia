[package]
name = "helia-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"

[dependencies.helia-core]
path = "../crates/helia-core"

[[bin]]
name = "ser_reader"
path = "fuzz_targets/ser_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fits_reader"
path = "fuzz_targets/fits_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "avi_reader"
path = "fuzz_targets/avi_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "video_probe"
path = "fuzz_targets/video_probe.rs"
test = false
doc = false
bench = false

# Keep the fuzz crate out of the main workspace.
[workspace]
