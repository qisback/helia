<svg xmlns="http://www.w3.org/2000/svg" width="480" height="224" viewBox="0 0 480 224" role="img" aria-labelledby="t d">
<title id="t">Residual pattern by calibration</title><desc id="d">Bars on a log axis: no calibration 0.01476, dark only 0.00706, flat only 0.01623, dark, flat and bad pixels 0.00021.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="223" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Residual pattern by calibration</text>
<text x="158.0" y="66.0" class="ink" text-anchor="end">None</text>
<rect x="166.0" y="53.0" width="189.4" height="18" fill="#0072B2"/>
<text x="359.4" y="69.0" class="sub" text-anchor="start" style="font-size:11px">0.01476</text>
<text x="158.0" y="94.0" class="ink" text-anchor="end">Dark only</text>
<rect x="166.0" y="81.0" width="161.5" height="18" fill="#0072B2"/>
<text x="331.5" y="97.0" class="sub" text-anchor="start" style="font-size:11px">0.00706</text>
<text x="158.0" y="122.0" class="ink" text-anchor="end">Flat only</text>
<rect x="166.0" y="109.0" width="193.0" height="18" fill="#0072B2"/>
<text x="363.0" y="125.0" class="sub" text-anchor="start" style="font-size:11px">0.01623</text>
<text x="158.0" y="146.5" class="ink" text-anchor="end">Dark, flat, bad</text>
<text x="158.0" y="161.5" class="ink" text-anchor="end">pixels</text>
<rect x="166.0" y="141.0" width="28.1" height="18" fill="#0072B2"/>
<text x="198.1" y="157.0" class="sub" text-anchor="start" style="font-size:11px">0.00021</text>
<line class="grid" x1="166.0" x2="166.0" y1="46" y2="168"/>
<text x="166.0" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">0.0001</text>
<line class="grid" x1="253.3" x2="253.3" y1="46" y2="168"/>
<text x="253.3" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">0.001</text>
<line class="grid" x1="340.7" x2="340.7" y1="46" y2="168"/>
<text x="340.7" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">0.01</text>
<line class="grid" x1="428.0" x2="428.0" y1="46" y2="168"/>
<text x="428.0" y="184.0" class="sub" text-anchor="middle" style="font-size:11px">0.1</text>
<line class="axis" x1="166" x2="166" y1="46" y2="168"/>
<text x="297.0" y="202.0" class="sub" text-anchor="middle">Residual pattern, rms (lower is better), log scale</text>
</svg>
