<text x="413.0" y="89.0" class="sub" text-anchor="start" style="font-size:11px">0.645</text>
<text x="158.0" y="119.0" class="ink" text-anchor="end">Frame 2 (14:37:19)</text>
<line x1="372.9" x2="388.0" y1="115.0" y2="115.0" stroke="#999999" stroke-width="3"/>
