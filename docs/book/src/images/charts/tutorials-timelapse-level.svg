<text x="362.9" y="119.0" class="sub" text-anchor="end" style="font-size:11px">0.563</text>
<line class="grid" x1="166.0" x2="166.0" y1="68" y2="130"/>
<text x="166.0" y="146.0" class="sub" text-anchor="middle" style="font-size:11px">0</text>
<line class="grid" x1="239.5" x2="239.5" y1="68" y2="130"/>
<text x="239.5" y="146.0" class="sub" text-anchor="middle" style="font-size:11px">0.2</text>
<line class="grid" x1="313.0" x2="313.0" y1="68" y2="130"/>
<text x="313.0" y="146.0" class="sub" text-anchor="middle" style="font-size:11px">0.4</text>
<line class="grid" x1="386.5" x2="386.5" y1="68" y2="130"/>
