<text x="105.0" y="49.0" class="ink" text-anchor="start">After the gain</text>
<text x="158.0" y="89.0" class="ink" text-anchor="end">Frame 1 (14:32:09)</text>
<line x1="403.0" x2="388.0" y1="85.0" y2="85.0" stroke="#999999" stroke-width="3"/>
<circle cx="403.0" cy="85.0" r="6" fill="#0072B2"/>
