<svg xmlns="http://www.w3.org/2000/svg" width="480" height="216" viewBox="0 0 480 216" role="img" aria-labelledby="t d">
<title id="t">Focal ratio for Nyquist sampling</title><desc id="d">Bars: 550 nm with 3.76 micron pixels f/13.7, 550 nm with 2.4 micron f/8.7, 656.3 nm with 3.76 micron f/11.5, 393.4 nm with 3.76 micron f/19.1.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="215" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Focal ratio for Nyquist sampling</text>
<text x="158.0" y="66.0" class="ink" text-anchor="end">550 nm, 3.76 um</text>
<rect x="166.0" y="53.0" width="179.5" height="18" fill="#0072B2"/>
<text x="349.5" y="69.0" class="sub" text-anchor="start" style="font-size:11px">13.7</text>
<text x="158.0" y="94.0" class="ink" text-anchor="end">550 nm, 2.4 um</text>
<rect x="166.0" y="81.0" width="114.0" height="18" fill="#0072B2"/>
<text x="284.0" y="97.0" class="sub" text-anchor="start" style="font-size:11px">8.7</text>
<text x="158.0" y="122.0" class="ink" text-anchor="end">656.3 nm, 3.76 um</text>
<rect x="166.0" y="109.0" width="150.6" height="18" fill="#0072B2"/>
<text x="320.6" y="125.0" class="sub" text-anchor="start" style="font-size:11px">11.5</text>
<text x="158.0" y="150.0" class="ink" text-anchor="end">393.4 nm, 3.76 um</text>
<rect x="166.0" y="137.0" width="250.2" height="18" fill="#0072B2"/>
<text x="420.2" y="153.0" class="sub" text-anchor="start" style="font-size:11px">19.1</text>
<line class="grid" x1="166.0" x2="166.0" y1="46" y2="160"/>
<text x="166.0" y="176.0" class="sub" text-anchor="middle" style="font-size:11px">0</text>
<line class="grid" x1="231.5" x2="231.5" y1="46" y2="160"/>
<text x="231.5" y="176.0" class="sub" text-anchor="middle" style="font-size:11px">5</text>
<line class="grid" x1="297.0" x2="297.0" y1="46" y2="160"/>
<text x="297.0" y="176.0" class="sub" text-anchor="middle" style="font-size:11px">10</text>
<line class="grid" x1="362.5" x2="362.5" y1="46" y2="160"/>
<text x="362.5" y="176.0" class="sub" text-anchor="middle" style="font-size:11px">15</text>
<line class="grid" x1="428.0" x2="428.0" y1="46" y2="160"/>
<text x="428.0" y="176.0" class="sub" text-anchor="middle" style="font-size:11px">20</text>
<line class="axis" x1="166" x2="166" y1="46" y2="160"/>
<text x="297.0" y="194.0" class="sub" text-anchor="middle">Focal ratio, f/ (minimum for Nyquist)</text>
</svg>
