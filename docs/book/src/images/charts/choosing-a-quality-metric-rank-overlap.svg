<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="t d">
<title id="t">Best-quarter overlap with gradient</title><desc id="d">Bars: laplacian 60 per cent, helmli 70, fourier 47, mfgs 33, dct 33 and contrast 23, against 25 per cent by chance.</desc>
