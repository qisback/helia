<svg xmlns="http://www.w3.org/2000/svg" width="480" height="216" viewBox="0 0 480 216" role="img" aria-labelledby="t d">
<title id="t">Mid-grey through the H-alpha look</title><desc id="d">Dumbbells of the output level, old then new: red 169 then 169, green 90 then 68, blue 33 then 11.</desc>
<style>
