<text x="220.4" y="167.0" class="sub" text-anchor="start" style="font-size:11px">3.78</text>
<rect x="166.0" y="171.0" width="224.9" height="14" fill="#D55E00"/>
<text x="394.9" y="183.0" class="sub" text-anchor="start" style="font-size:11px">376.20</text>
<text x="158.0" y="214.0" class="ink" text-anchor="end">Dark and flat</text>
<rect x="166.0" y="195.0" width="28.1" height="14" fill="#0072B2"/>
<text x="198.1" y="207.0" class="sub" text-anchor="start" style="font-size:11px">2.10</text>
