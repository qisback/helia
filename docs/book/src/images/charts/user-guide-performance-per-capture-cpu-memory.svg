<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-labelledby="t d">
<title id="t">CPU peak memory per capture</title><desc id="d">Horizontal bars of CPU peak resident set in gigabytes: 2.2 for the 1080p 16-bit SER, 2.3 for the 1.0 GB AVI, 2.2 for the 1.3 GB AVI, 2.2 for the 1.3 GB SER and 2.2 for the 5.6 GB AVI.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="259" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">CPU peak memory per capture</text>
<text x="158.0" y="62.5" class="ink" text-anchor="end">0.4 GB 1080p 16-bit</text>
<text x="158.0" y="77.5" class="ink" text-anchor="end">SER</text>
<rect x="166.0" y="57.0" width="230.6" height="18" fill="#0072B2"/>
<text x="400.6" y="73.0" class="sub" text-anchor="start" style="font-size:11px">2.2</text>
<text x="158.0" y="102.0" class="ink" text-anchor="end">1.0 GB 1936x1088 AVI</text>
<rect x="166.0" y="89.0" width="241.0" height="18" fill="#0072B2"/>
<text x="411.0" y="105.0" class="sub" text-anchor="start" style="font-size:11px">2.3</text>
<text x="158.0" y="130.0" class="ink" text-anchor="end">1.3 GB 1080p AVI</text>
<rect x="166.0" y="117.0" width="230.6" height="18" fill="#0072B2"/>
<text x="400.6" y="133.0" class="sub" text-anchor="start" style="font-size:11px">2.2</text>
<text x="158.0" y="158.0" class="ink" text-anchor="end">1.3 GB 1080p SER</text>
<rect x="166.0" y="145.0" width="230.6" height="18" fill="#0072B2"/>
<text x="400.6" y="161.0" class="sub" text-anchor="start" style="font-size:11px">2.2</text>
<text x="158.0" y="182.5" class="ink" text-anchor="end">5.6 GB 1080p Bayer</text>
<text x="158.0" y="197.5" class="ink" text-anchor="end">AVI</text>
<rect x="166.0" y="177.0" width="230.6" height="18" fill="#0072B2"/>
<text x="400.6" y="193.0" class="sub" text-anchor="start" style="font-size:11px">2.2</text>
<line class="grid" x1="166.0" x2="166.0" y1="46" y2="204"/>
<text x="166.0" y="220.0" class="sub" text-anchor="middle" style="font-size:11px">0</text>
<line class="grid" x1="218.4" x2="218.4" y1="46" y2="204"/>
<text x="218.4" y="220.0" class="sub" text-anchor="middle" style="font-size:11px">0.5</text>
<line class="grid" x1="270.8" x2="270.8" y1="46" y2="204"/>
<text x="270.8" y="220.0" class="sub" text-anchor="middle" style="font-size:11px">1</text>
<line class="grid" x1="323.2" x2="323.2" y1="46" y2="204"/>
<text x="323.2" y="220.0" class="sub" text-anchor="middle" style="font-size:11px">1.5</text>
<line class="grid" x1="375.6" x2="375.6" y1="46" y2="204"/>
<text x="375.6" y="220.0" class="sub" text-anchor="middle" style="font-size:11px">2</text>
<line class="grid" x1="428.0" x2="428.0" y1="46" y2="204"/>
<text x="428.0" y="220.0" class="sub" text-anchor="middle" style="font-size:11px">2.5</text>
<line class="axis" x1="166" x2="166" y1="46" y2="204"/>
<text x="297.0" y="238.0" class="sub" text-anchor="middle">Peak resident memory, GB</text>
</svg>
