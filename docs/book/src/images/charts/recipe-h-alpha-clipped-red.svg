<svg xmlns="http://www.w3.org/2000/svg" width="480" height="309" viewBox="0 0 480 309" role="img" aria-labelledby="t d">
<title id="t">Granulation band, red against green</title><desc id="d">Two bars of granulation-band contrast: red plane 0.14 per cent, green plane 1.39 per cent.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="308" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Granulation band, red against green</text>
<line class="grid" x1="58" x2="468" y1="246.0" y2="246.0"/>
<text x="52.0" y="250.0" class="sub" text-anchor="end" style="font-size:11px">0</text>
<line class="grid" x1="58" x2="468" y1="214.3" y2="214.3"/>
<text x="52.0" y="218.3" class="sub" text-anchor="end" style="font-size:11px">0.25</text>
<line class="grid" x1="58" x2="468" y1="182.7" y2="182.7"/>
<text x="52.0" y="186.7" class="sub" text-anchor="end" style="font-size:11px">0.5</text>
<line class="grid" x1="58" x2="468" y1="151.0" y2="151.0"/>
<text x="52.0" y="155.0" class="sub" text-anchor="end" style="font-size:11px">0.75</text>
<line class="grid" x1="58" x2="468" y1="119.3" y2="119.3"/>
<text x="52.0" y="123.3" class="sub" text-anchor="end" style="font-size:11px">1</text>
<line class="grid" x1="58" x2="468" y1="87.7" y2="87.7"/>
<text x="52.0" y="91.7" class="sub" text-anchor="end" style="font-size:11px">1.25</text>
<line class="grid" x1="58" x2="468" y1="56.0" y2="56.0"/>
<text x="52.0" y="60.0" class="sub" text-anchor="end" style="font-size:11px">1.5</text>
<rect x="143.5" y="228.3" width="33.0" height="17.7" fill="#0072B2"/>
<text x="160.0" y="225.3" class="sub" text-anchor="middle" style="font-size:11px">0.14</text>
<text x="160.5" y="262.0" class="ink" text-anchor="middle">Red plane (clipped)</text>
<rect x="348.5" y="69.9" width="33.0" height="176.1" fill="#0072B2"/>
<text x="365.0" y="66.9" class="sub" text-anchor="middle" style="font-size:11px">1.39</text>
<text x="365.5" y="262.0" class="ink" text-anchor="middle">Green plane</text>
<line class="axis" x1="58" x2="468" y1="246.0" y2="246.0"/>
<line class="axis" x1="58" x2="58" y1="56" y2="246"/>
<text x="240.0" y="287.0" class="sub" text-anchor="middle">Band-pass contrast, per cent (higher is more detail)</text>
</svg>
