<text x="52.0" y="217.5" class="sub" text-anchor="end" style="font-size:11px">0.5</text>
<line class="grid" x1="58" x2="462" y1="161.0" y2="161.0"/>
<text x="52.0" y="165.0" class="sub" text-anchor="end" style="font-size:11px">1</text>
<line class="grid" x1="58" x2="462" y1="108.5" y2="108.5"/>
<text x="52.0" y="112.5" class="sub" text-anchor="end" style="font-size:11px">1.5</text>
<line class="grid" x1="58" x2="462" y1="56.0" y2="56.0"/>
<text x="52.0" y="60.0" class="sub" text-anchor="end" style="font-size:11px">2</text>
<line class="grid" x1="58.0" x2="58.0" y1="56" y2="266"/>
<text x="58.0" y="282.0" class="sub" text-anchor="middle" style="font-size:11px">0</text>
<line class="grid" x1="138.8" x2="138.8" y1="56" y2="266"/>
