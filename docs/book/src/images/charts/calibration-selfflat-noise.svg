<line class="grid" x1="300.4" x2="300.4" y1="56" y2="266"/>
<text x="300.4" y="282.0" class="sub" text-anchor="middle" style="font-size:11px">0.03</text>
<line class="grid" x1="381.2" x2="381.2" y1="56" y2="266"/>
<text x="381.2" y="282.0" class="sub" text-anchor="middle" style="font-size:11px">0.04</text>
<line class="grid" x1="462.0" x2="462.0" y1="56" y2="266"/>
