<svg xmlns="http://www.w3.org/2000/svg" width="480" height="262" viewBox="0 0 480 262" role="img" aria-labelledby="t d">
<title id="t">Change to a clean stack</title><desc id="d">RMS difference from the mean, times 1000: sigma 0.45, huber 0.46, winsor 0.18. Largest difference: sigma 8.09, huber 6.00, winsor 2.98.</desc>
