<svg xmlns="http://www.w3.org/2000/svg" width="480" height="309" viewBox="0 0 480 309" role="img" aria-labelledby="t d">
<title id="t">Motion index by turbulence height</title><desc id="d">Bars: index 0.0000 with all turbulence at the ground, 0.0486 with half at height and 0.0667 with all at height.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="308" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Motion index by turbulence height</text>
<line class="grid" x1="58" x2="468" y1="246.0" y2="246.0"/>
<text x="52.0" y="250.0" class="sub" text-anchor="end" style="font-size:11px">0</text>
<line class="grid" x1="58" x2="468" y1="198.5" y2="198.5"/>
<text x="52.0" y="202.5" class="sub" text-anchor="end" style="font-size:11px">0.02</text>
<line class="grid" x1="58" x2="468" y1="151.0" y2="151.0"/>
<text x="52.0" y="155.0" class="sub" text-anchor="end" style="font-size:11px">0.04</text>
<line class="grid" x1="58" x2="468" y1="103.5" y2="103.5"/>
<text x="52.0" y="107.5" class="sub" text-anchor="end" style="font-size:11px">0.06</text>
<line class="grid" x1="58" x2="468" y1="56.0" y2="56.0"/>
<text x="52.0" y="60.0" class="sub" text-anchor="end" style="font-size:11px">0.08</text>
<rect x="109.3" y="246.0" width="33.0" height="1.0" fill="#0072B2"/>
<text x="125.8" y="243.0" class="sub" text-anchor="middle" style="font-size:11px">0.0000</text>
<text x="126.3" y="262.0" class="ink" text-anchor="middle">All at ground</text>
<rect x="246.0" y="130.6" width="33.0" height="115.4" fill="#0072B2"/>
<text x="262.5" y="127.6" class="sub" text-anchor="middle" style="font-size:11px">0.0486</text>
<text x="263.0" y="262.0" class="ink" text-anchor="middle">Half and half</text>
<rect x="382.7" y="87.6" width="33.0" height="158.4" fill="#0072B2"/>
<text x="399.2" y="84.6" class="sub" text-anchor="middle" style="font-size:11px">0.0667</text>
<text x="399.7" y="262.0" class="ink" text-anchor="middle">All at height</text>
<line class="axis" x1="58" x2="468" y1="246.0" y2="246.0"/>
<line class="axis" x1="58" x2="58" y1="56" y2="246"/>
<text x="240.0" y="287.0" class="sub" text-anchor="middle">Motion index (relative, pupil pixels)</text>
</svg>
