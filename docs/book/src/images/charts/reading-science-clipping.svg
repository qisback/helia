<svg xmlns="http://www.w3.org/2000/svg" width="480" height="216" viewBox="0 0 480 216" role="img" aria-labelledby="t d">
<title id="t">Pixels at the top and bottom level</title><desc id="d">Horizontal bars of per cent of pixels at a limit: raw red plane 92.4 at the sensor limit, raw green 1.6, written image 8.5 at zero and 1.3 at the top.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="215" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Pixels at the top and bottom level</text>
<text x="158.0" y="66.0" class="ink" text-anchor="end">Raw red, at limit</text>
<rect x="166.0" y="53.0" width="242.1" height="18" fill="#0072B2"/>
<text x="412.1" y="69.0" class="sub" text-anchor="start" style="font-size:11px">92.4</text>
<text x="158.0" y="94.0" class="ink" text-anchor="end">Raw green, at limit</text>
<rect x="166.0" y="81.0" width="4.2" height="18" fill="#0072B2"/>
<text x="174.2" y="97.0" class="sub" text-anchor="start" style="font-size:11px">1.6</text>
<text x="158.0" y="122.0" class="ink" text-anchor="end">Written, at zero</text>
<rect x="166.0" y="109.0" width="22.3" height="18" fill="#0072B2"/>
<text x="192.3" y="125.0" class="sub" text-anchor="start" style="font-size:11px">8.5</text>
<text x="158.0" y="150.0" class="ink" text-anchor="end">Written, at top</text>
<rect x="166.0" y="137.0" width="3.4" height="18" fill="#0072B2"/>
<text x="173.4" y="153.0" class="sub" text-anchor="start" style="font-size:11px">1.3</text>
<line class="grid" x1="166.0" x2="166.0" y1="46" y2="160"/>
<text x="166.0" y="176.0" class="sub" text-anchor="middle" style="font-size:11px">0</text>
<line class="grid" x1="218.4" x2="218.4" y1="46" y2="160"/>
<text x="218.4" y="176.0" class="sub" text-anchor="middle" style="font-size:11px">20</text>
<line class="grid" x1="270.8" x2="270.8" y1="46" y2="160"/>
<text x="270.8" y="176.0" class="sub" text-anchor="middle" style="font-size:11px">40</text>
<line class="grid" x1="323.2" x2="323.2" y1="46" y2="160"/>
<text x="323.2" y="176.0" class="sub" text-anchor="middle" style="font-size:11px">60</text>
<line class="grid" x1="375.6" x2="375.6" y1="46" y2="160"/>
<text x="375.6" y="176.0" class="sub" text-anchor="middle" style="font-size:11px">80</text>
<line class="grid" x1="428.0" x2="428.0" y1="46" y2="160"/>
<text x="428.0" y="176.0" class="sub" text-anchor="middle" style="font-size:11px">100</text>
<line class="axis" x1="166" x2="166" y1="46" y2="160"/>
<text x="297.0" y="194.0" class="sub" text-anchor="middle">Share of pixels, per cent</text>
</svg>
