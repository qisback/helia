<svg xmlns="http://www.w3.org/2000/svg" width="480" height="309" viewBox="0 0 480 309" role="img" aria-labelledby="t d">
<title id="t">Granulation to fine band ratio by plane</title><desc id="d">Bars of the granulation-band to fine-band ratio: blue 3.5, luminance 3.2, red 3.3, green 3.0.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="308" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Granulation to fine band ratio by plane</text>
<line class="grid" x1="58" x2="468" y1="246.0" y2="246.0"/>
<text x="52.0" y="250.0" class="sub" text-anchor="end" style="font-size:11px">0</text>
<line class="grid" x1="58" x2="468" y1="198.5" y2="198.5"/>
<text x="52.0" y="202.5" class="sub" text-anchor="end" style="font-size:11px">1</text>
<line class="grid" x1="58" x2="468" y1="151.0" y2="151.0"/>
<text x="52.0" y="155.0" class="sub" text-anchor="end" style="font-size:11px">2</text>
<line class="grid" x1="58" x2="468" y1="103.5" y2="103.5"/>
<text x="52.0" y="107.5" class="sub" text-anchor="end" style="font-size:11px">3</text>
<line class="grid" x1="58" x2="468" y1="56.0" y2="56.0"/>
<text x="52.0" y="60.0" class="sub" text-anchor="end" style="font-size:11px">4</text>
<rect x="92.2" y="79.8" width="33.0" height="166.2" fill="#0072B2"/>
<text x="108.8" y="76.8" class="sub" text-anchor="middle" style="font-size:11px">3.5</text>
<text x="109.2" y="262.0" class="ink" text-anchor="middle">Blue</text>
<rect x="194.8" y="94.0" width="33.0" height="152.0" fill="#0072B2"/>
<text x="211.2" y="91.0" class="sub" text-anchor="middle" style="font-size:11px">3.2</text>
<text x="211.8" y="262.0" class="ink" text-anchor="middle">Luminance</text>
<rect x="297.2" y="89.2" width="33.0" height="156.8" fill="#0072B2"/>
<text x="313.8" y="86.2" class="sub" text-anchor="middle" style="font-size:11px">3.3</text>
<text x="314.2" y="262.0" class="ink" text-anchor="middle">Red</text>
<rect x="399.8" y="103.5" width="33.0" height="142.5" fill="#0072B2"/>
<text x="416.2" y="100.5" class="sub" text-anchor="middle" style="font-size:11px">3.0</text>
<text x="416.8" y="262.0" class="ink" text-anchor="middle">Green</text>
<line class="axis" x1="58" x2="468" y1="246.0" y2="246.0"/>
<line class="axis" x1="58" x2="58" y1="56" y2="246"/>
<text x="240.0" y="287.0" class="sub" text-anchor="middle">Band ratio (higher is cleaner)</text>
</svg>
