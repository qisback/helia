<text x="158.0" y="181.5" class="ink" text-anchor="end">1000</text>
<rect x="166.0" y="155.0" width="50.8" height="14" fill="#0072B2"/>
<text x="220.8" y="167.0" class="sub" text-anchor="start" style="font-size:11px">15.5</text>
