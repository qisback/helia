<svg xmlns="http://www.w3.org/2000/svg" width="480" height="286" viewBox="0 0 480 286" role="img" aria-labelledby="t d">
<title id="t">CPU time, before and now</title><desc id="d">Horizontal grouped bars of CPU wall seconds before and now: 8.3 to 2.9, 31.1 to 15.0, 15.5 to 5.4 and 70.5 to 19.2, for the four captures.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="285" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">CPU time, before and now</text>
<rect x="16" y="38" width="12" height="12" rx="2" fill="#0072B2"/>
<text x="34.0" y="49.0" class="ink" text-anchor="start">CPU, before</text>
