<text x="147.0" y="49.0" class="ink" text-anchor="start">CPU, now</text>
<text x="158.0" y="86.5" class="ink" text-anchor="end">1080p 16-bit Bayer</text>
<text x="158.0" y="101.5" class="ink" text-anchor="end">SER, 100</text>
<rect x="166.0" y="75.0" width="27.2" height="14" fill="#0072B2"/>
<text x="197.2" y="87.0" class="sub" text-anchor="start" style="font-size:11px">8.3</text>
