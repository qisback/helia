<svg xmlns="http://www.w3.org/2000/svg" width="480" height="346" viewBox="0 0 480 346" role="img" aria-labelledby="t d">
<title id="t">Band-pass contrast of the disc centre</title><desc id="d">Grouped bars: noise band 0.30, 0.49 and 0.62; detail band 0.96, 0.93 and 1.96 per cent of the mean, for the stack, Richardson-Lucy with the image-scale PSF and with the limb PSF.</desc>
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.ink{fill:#1f2328}.sub{fill:#59636e}
.grid{stroke:#d8dee4;stroke-width:1}.axis{stroke:#59636e;stroke-width:1}
.ln{fill:none}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px}
.t{font-size:14px;font-weight:600}
@media (prefers-color-scheme:dark){.bg{fill:#161b22;stroke:#30363d}.ink{fill:#e6edf3}.sub{fill:#9da7b3}
.grid{stroke:#30363d}.axis{stroke:#9da7b3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="479" height="345" rx="8"/>
<text x="16.0" y="24.0" class="ink t" text-anchor="start">Band-pass contrast of the disc centre</text>
<rect x="16" y="38" width="12" height="12" rx="2" fill="#0072B2"/>
<text x="34.0" y="49.0" class="ink" text-anchor="start">Noise (pixel scale)</text>
<rect x="185.0" y="38" width="12" height="12" rx="2" fill="#D55E00"/>
<text x="203.0" y="49.0" class="ink" text-anchor="start">Detail (1 to 4 px)</text>
<line class="grid" x1="58" x2="468" y1="268.0" y2="268.0"/>
<text x="52.0" y="272.0" class="sub" text-anchor="end" style="font-size:11px">0</text>
<line class="grid" x1="58" x2="468" y1="220.5" y2="220.5"/>
<text x="52.0" y="224.5" class="sub" text-anchor="end" style="font-size:11px">0.5</text>
<line class="grid" x1="58" x2="468" y1="173.0" y2="173.0"/>
<text x="52.0" y="177.0" class="sub" text-anchor="end" style="font-size:11px">1</text>
<line class="grid" x1="58" x2="468" y1="125.5" y2="125.5"/>
<text x="52.0" y="129.5" class="sub" text-anchor="end" style="font-size:11px">1.5</text>
<line class="grid" x1="58" x2="468" y1="78.0" y2="78.0"/>
<text x="52.0" y="82.0" class="sub" text-anchor="end" style="font-size:11px">2</text>
<rect x="92.3" y="239.5" width="33.0" height="28.5" fill="#0072B2"/>
<text x="108.8" y="236.5" class="sub" text-anchor="middle" style="font-size:11px">0.30</text>
<rect x="126.3" y="176.8" width="33.0" height="91.2" fill="#D55E00"/>
<text x="142.8" y="173.8" class="sub" text-anchor="middle" style="font-size:11px">0.96</text>
<text x="126.3" y="284.0" class="ink" text-anchor="middle">Stack</text>
<rect x="229.0" y="221.4" width="33.0" height="46.6" fill="#0072B2"/>
<text x="245.5" y="218.4" class="sub" text-anchor="middle" style="font-size:11px">0.49</text>
<rect x="263.0" y="179.6" width="33.0" height="88.4" fill="#D55E00"/>
<text x="279.5" y="176.6" class="sub" text-anchor="middle" style="font-size:11px">0.93</text>
<text x="263.0" y="284.0" class="ink" text-anchor="middle">RL, image-scale</text>
<text x="263.0" y="299.0" class="ink" text-anchor="middle">PSF</text>
<rect x="365.7" y="209.1" width="33.0" height="58.9" fill="#0072B2"/>
<text x="382.2" y="206.1" class="sub" text-anchor="middle" style="font-size:11px">0.62</text>
<rect x="399.7" y="81.8" width="33.0" height="186.2" fill="#D55E00"/>
<text x="416.2" y="78.8" class="sub" text-anchor="middle" style="font-size:11px">1.96</text>
<text x="399.7" y="284.0" class="ink" text-anchor="middle">RL, limb PSF</text>
<line class="axis" x1="58" x2="468" y1="268.0" y2="268.0"/>
<line class="axis" x1="58" x2="58" y1="78" y2="268"/>
<text x="240.0" y="324.0" class="sub" text-anchor="middle">Band-pass contrast, per cent of the mean</text>
</svg>
