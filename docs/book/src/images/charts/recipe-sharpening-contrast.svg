<svg xmlns="http://www.w3.org/2000/svg" width="480" height="331" viewBox="0 0 480 331" role="img" aria-labelledby="t d">
<title id="t">Band-pass contrast by sharpening</title><desc id="d">Grouped bars of band-pass contrast in per cent of the mean. Pixel scale: stack 0.30, old wavelets 0.40, new wavelets 0.62, this recipe 0.72. 1 to 4 px: 0.96, 1.22, 2.17, 2.05. 4 to 12 px: 0.79, 0.92, 1.62, 1.23.</desc>
