<svg xmlns="http://www.w3.org/2000/svg" width="480" height="309" viewBox="0 0 480 309" role="img" aria-labelledby="t d">
<title id="t">Mosaic check, four pixel positions</title><desc id="d">Bars of share of full scale at the four cell positions: 79.6, 77.6, 77.4 and 0.3 per cent; the last is the empty blue pixel.</desc>
