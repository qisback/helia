<text x="52.0" y="228.0" class="sub" text-anchor="end" style="font-size:11px">0.08</text>
<line class="grid" x1="58" x2="462" y1="182.0" y2="182.0"/>
<text x="52.0" y="186.0" class="sub" text-anchor="end" style="font-size:11px">0.09</text>
<line class="grid" x1="58" x2="462" y1="140.0" y2="140.0"/>
<text x="52.0" y="144.0" class="sub" text-anchor="end" style="font-size:11px">0.1</text>
<line class="grid" x1="58" x2="462" y1="98.0" y2="98.0"/>
<text x="52.0" y="102.0" class="sub" text-anchor="end" style="font-size:11px">0.11</text>
<line class="grid" x1="58" x2="462" y1="56.0" y2="56.0"/>
<text x="52.0" y="60.0" class="sub" text-anchor="end" style="font-size:11px">0.12</text>
<line class="grid" x1="58.0" x2="58.0" y1="56" y2="266"/>
<text x="58.0" y="282.0" class="sub" text-anchor="middle" style="font-size:11px">0.5</text>
<line class="grid" x1="159.0" x2="159.0" y1="56" y2="266"/>
<text x="159.0" y="282.0" class="sub" text-anchor="middle" style="font-size:11px">1</text>
<line class="grid" x1="260.0" x2="260.0" y1="56" y2="266"/>
<text x="260.0" y="282.0" class="sub" text-anchor="middle" style="font-size:11px">1.5</text>
<line class="grid" x1="361.0" x2="361.0" y1="56" y2="266"/>
<text x="361.0" y="282.0" class="sub" text-anchor="middle" style="font-size:11px">2</text>
<line class="grid" x1="462.0" x2="462.0" y1="56" y2="266"/>
