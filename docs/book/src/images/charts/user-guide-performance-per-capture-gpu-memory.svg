<text x="158.0" y="186.0" class="ink" text-anchor="end">1.3 GB 1080p SER</text>
<rect x="166.0" y="173.0" width="206.0" height="18" fill="#0072B2"/>
<text x="376.0" y="189.0" class="sub" text-anchor="start" style="font-size:11px">629</text>
<text x="158.0" y="214.0" class="ink" text-anchor="end">3.1 GB 640x480 AVI</text>
<rect x="166.0" y="201.0" width="107.4" height="18" fill="#0072B2"/>
<text x="277.4" y="217.0" class="sub" text-anchor="start" style="font-size:11px">328</text>
<text x="158.0" y="238.5" class="ink" text-anchor="end">5.6 GB 1080p Bayer</text>
<text x="158.0" y="253.5" class="ink" text-anchor="end">AVI</text>
<rect x="166.0" y="233.0" width="214.8" height="18" fill="#0072B2"/>
<text x="384.8" y="249.0" class="sub" text-anchor="start" style="font-size:11px">656</text>
<line class="grid" x1="166.0" x2="166.0" y1="46" y2="260"/>
<text x="166.0" y="276.0" class="sub" text-anchor="middle" style="font-size:11px">0</text>
<line class="grid" x1="231.5" x2="231.5" y1="46" y2="260"/>
<text x="231.5" y="276.0" class="sub" text-anchor="middle" style="font-size:11px">200</text>
<line class="grid" x1="297.0" x2="297.0" y1="46" y2="260"/>
<text x="297.0" y="276.0" class="sub" text-anchor="middle" style="font-size:11px">400</text>
<line class="grid" x1="362.5" x2="362.5" y1="46" y2="260"/>
<text x="362.5" y="276.0" class="sub" text-anchor="middle" style="font-size:11px">600</text>
<line class="grid" x1="428.0" x2="428.0" y1="46" y2="260"/>
