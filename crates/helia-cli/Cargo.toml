[package]
name = "helia-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
description = "Helia command-line stacker"
publish = false
build = "build.rs"

[lints]
workspace = true

[lib]
name = "helia_cli"
path = "src/lib.rs"

[[bin]]
name = "helia"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
helia-core = { version = "0.7.1", path = "../helia-core" }
helia-feedback = { version = "0.7.1", path = "../helia-feedback" }
helia-gpu = { version = "0.7.1", path = "../helia-gpu" }
helia-plugin = { version = "0.7.1", path = "../helia-plugin" }
helia-plugin-sdk = { version = "0.1.0", path = "../helia-plugin-sdk" }
helia-report = { version = "0.7.1", path = "../helia-report" }
helia-update = { version = "0.7.1", path = "../helia-update" }
helia-server = { version = "0.7.1", path = "../helia-server" }
indicatif = "0.18.6"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "signal"] }

[dev-dependencies]
assert_cmd = "2.2.2"
helia-core = { version = "0.7.1", path = "../helia-core", features = ["testutil"] }
png = "0.18.1"
predicates = "3.1.4"
tempfile = "3.27.0"
tiff = { version = "0.11.3", default-features = false }

# VersionInfo resource in the Windows executables; see build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }
