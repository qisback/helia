[package]
name = "helia-feedback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
description = "Helia feedback: relay protocol types, proof of work, highlights and client"
publish = false

[lints]
workspace = true

[features]
default = ["client"]
# The HTTP client and the zip writer. The relay itself needs only the protocol
# types, so it can depend on this crate with default-features = false.
client = ["dep:ureq", "dep:zip"]

[dependencies]
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"], optional = true }
zip = { version = "9.0.5", default-features = false, optional = true }
