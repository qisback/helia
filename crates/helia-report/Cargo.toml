[package]
name = "helia-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
description = "Helia science outputs: plots, data files and the HTML report of a stack"
publish = false

[lints]
workspace = true

[dependencies]
helia-core = { version = "0.7.1", path = "../helia-core" }
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "ab_glyph", "line_series", "point_series", "area_series"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
helia-core = { version = "0.7.1", path = "../helia-core", features = ["testutil"] }
