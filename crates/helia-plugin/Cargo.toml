[package]
name = "helia-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
description = "Helia plugin host: manifests, approval, the plugin process and the pipeline steps built on it"
publish = false

[lints]
workspace = true

[lib]
name = "helia_plugin"
path = "src/lib.rs"

# A plugin the tests drive end to end (not shipped).
[[bin]]
name = "helia-plugin-testbed"
path = "src/bin/testbed.rs"
test = false

[dependencies]
helia-core = { version = "0.7.1", path = "../helia-core" }
helia-plugin-sdk = { version = "0.1.0", path = "../helia-plugin-sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
helia-core = { version = "0.7.1", path = "../helia-core", features = ["testutil"] }
