# Checked by CI: `cargo deny --manifest-path crates/helia-plugin-sdk/Cargo.toml check licenses bans`.
# The SDK is MIT OR Apache-2.0, so nothing in its tree may be copyleft, and in particular no Helia crate.
[graph]
all-features = true

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib", "BSD-3-Clause", "ISC"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "helia-core" },
  { crate = "helia-gpu" },
  { crate = "helia-gui" },
  { crate = "helia-cli" },
  { crate = "helia-server" },
  { crate = "helia-report" },
  { crate = "helia-feedback" },
  { crate = "helia-plugin" },
]
